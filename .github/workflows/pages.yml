name: Pages

# The landing page (site/) on GitHub Pages. The screenshots in site/assets are made locally
# with site/shots/make.sh (a demo backend with seeded meetings), not here.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage the site (without the screenshot tooling)
        run: |
          mkdir _site
          cp -r site/index.html site/favicon.svg site/assets site/.nojekyll _site/
          test -f site/CNAME && cp site/CNAME _site/ || true
          ls -la _site _site/assets
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
