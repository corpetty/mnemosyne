name: Pages

# The landing page (site/) on GitHub Pages. The screenshots in site/assets are made locally
# with site/shots/make.sh (a demo backend with seeded meetings), not here.
on:
  push:
    branches: [main]
    paths: ["site/**", "backend/mnemosyne/api/static/guest/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage the site (without the screenshot tooling)
        run: |
          mkdir _site
          cp -r site/index.html site/favicon.svg site/assets site/.nojekyll _site/
          test -f site/CNAME && cp site/CNAME _site/ || true
          mkdir _site/n
          cp -r backend/mnemosyne/api/static/guest/. _site/n/
          # The static copy has no headers, so the guest page's policy goes in as a meta tag (our
          # servers send it as a header instead; a meta tag cannot carry frame-ancestors). Keep in
          # step with GUEST_CSP in publish-host/src/app.rs.
          python3 -I - <<'PY'
          p = "_site/n/index.html"
          s = open(p, encoding="utf-8").read()
          csp = ("default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; "
                 "connect-src 'self' https://*.relay.n0.iroh.link wss://*.relay.n0.iroh.link "
                 "https://relay.petty.services wss://relay.petty.services; "
                 "media-src blob:; img-src data: blob:; base-uri 'none'; form-action 'none'")
          meta = '<meta http-equiv="Content-Security-Policy" content="' + csp + '">'
          assert s.count("<head>") == 1
          open(p, "w", encoding="utf-8").write(s.replace("<head>", "<head>" + meta, 1))
          PY
          grep -c Content-Security-Policy _site/n/index.html
          ls -la _site _site/assets _site/n _site/n/assets
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
