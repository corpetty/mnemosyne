name: Release

# Tag a commit `vX.Y.Z` to build the Linux bundles and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Build deb + rpm + AppImage
    runs-on: ubuntu-22.04 # oldest glibc we ship; AppImage runs on anything newer
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev \
            libfuse2 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build bundles
        env:
          NO_STRIP: "true" # linuxdeploy's bundled strip fails on .relr.dyn sections
          # Signs the updater artifacts (.sig per bundle).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >
          pnpm tauri build --bundles deb,rpm,appimage
          --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb* dist/
          cp src-tauri/target/release/bundle/rpm/*.rpm* dist/
          cp src-tauri/target/release/bundle/appimage/*.AppImage* dist/
          ls -la dist
      - name: Updater manifest (latest.json)
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v$(jq -r .version src-tauri/tauri.conf.json)";; esac
          python3 scripts/updater-manifest.py "$tag" dist "docs/releases/$tag.md"
      - uses: actions/upload-artifact@v7
        with:
          name: mnemosyne-linux
          path: dist/*

  flatpak:
    name: Flatpak (from the deb)
    needs: bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/download-artifact@v8
        with:
          name: mnemosyne-linux
          path: dist
      - name: Stage the deb
        run: cp dist/*.deb flatpak/mnemosyne.deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/com.corpetty.mnemosyne.yml
          bundle: mnemosyne.flatpak
          cache: false
          artifact-name: mnemosyne-flatpak

  release:
    name: Attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mnemosyne-linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: mnemosyne-flatpak
          path: flatpak-out
      - name: Collect
        run: |
          cp flatpak-out/mnemosyne.flatpak "dist/Mnemosyne_${GITHUB_REF_NAME#v}_x86_64.flatpak"
          (cd dist && sha256sum *.AppImage *.deb *.rpm *.flatpak > SHA256SUMS)
          ls -la dist
      - name: Release notes
        id: notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
