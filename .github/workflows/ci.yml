name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg (mixer and import tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync (no GPU or ONNX extras; ML is faked in tests)
        run: uv sync --frozen --group dev
      - name: Lint
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Test
        run: uv run --frozen pytest -q -o faulthandler_timeout=60

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Generated API types are up to date
        run: bash scripts/gen-api-types.sh --check
      - run: pnpm check
      # The notes editor's pure parts (src/lib/notes) against the committed wasm module.
      - run: pnpm test:unit
      - run: pnpm build

  viewer:
    name: Publication viewer is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild the viewer
        run: pnpm build:viewer
      - name: The committed viewer is current
        run: |
          out=backend/mnemosyne/api/static/viewer
          if [ -n "$(git status --porcelain -- "$out")" ]; then
            git status --short -- "$out"
            git diff --stat -- "$out"
            echo "::error::the committed viewer is stale: run pnpm build:viewer and commit $out"
            exit 1
          fi
      # What this runner built, to compare with a local build when the two disagree.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: viewer-build
          path: backend/mnemosyne/api/static/viewer/
          retention-days: 7

  e2e:
    name: Browser tests (Playwright, demo backend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg (import decodes the uploaded file)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync backend (no ML extras; demo mode fakes them)
        run: uv sync --frozen
        working-directory: backend
      # The sidecar the backend runs for notes merges, library sync and remote access. The
      # backend finds it through MNEMOSYNE_LINK_BIN (the pytest suite points that at nothing;
      # this server is started by Playwright and inherits the variable from the step below).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: link
      - name: Build the link sidecar (debug is fast enough for the tests)
        run: cargo build --locked --manifest-path link/Cargo.toml
      - name: Install browsers (Chromium, and WebKit for the specs that need it)
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
        env:
          MNEMOSYNE_LINK_BIN: ${{ github.workspace }}/link/target/debug/mnemosyne-link
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  notes:
    name: Notes core and wasm module
    runs-on: ubuntu-24.04
    env:
      # The CLI must equal the wasm-bindgen crate in notes-wasm/Cargo.lock (the script checks).
      WASM_BINDGEN_VERSION: "0.2.129"
      # sha256 of wasm-bindgen-<version>-x86_64-unknown-linux-musl.tar.gz, from the release
      # asset's digest (gh api repos/wasm-bindgen/wasm-bindgen/releases/tags/<version>).
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
    steps:
      - uses: actions/checkout@v7
      # Pinned: the committed module (src/lib/notes/pkg) is byte-for-byte what this compiler
      # makes of notes-wasm. Bump it here, in scripts/build-notes-wasm.sh and rebuild together.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            notes-core
            notes-wasm
      - run: cargo fmt --check --manifest-path notes-core/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path notes-core/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path notes-core/Cargo.toml
      - run: cargo fmt --check --manifest-path notes-wasm/Cargo.toml
      - run: cargo clippy --locked --target wasm32-unknown-unknown --manifest-path notes-wasm/Cargo.toml -- -D warnings
      - name: wasm-bindgen CLI (prebuilt release, checksum verified)
        run: |
          set -euo pipefail
          archive="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$RUNNER_TEMP/wasm-bindgen"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/$archive"
          echo "${WASM_BINDGEN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/wasm-bindgen"
          bin="$(find "$RUNNER_TEMP/wasm-bindgen" -type f -name wasm-bindgen | head -n 1)"
          test -x "$bin"
          echo "WASM_BINDGEN=$bin" >> "$GITHUB_ENV"
      - name: Rebuild the wasm module
        run: bash scripts/build-notes-wasm.sh
      - name: The committed module is current
        run: |
          if [ -n "$(git status --porcelain -- src/lib/notes/pkg)" ]; then
            git status --short -- src/lib/notes/pkg
            git diff --stat -- src/lib/notes/pkg
            echo "::error::the committed wasm is stale: run scripts/build-notes-wasm.sh"
            exit 1
          fi
      # What this compiler made, to compare with a local build when the two disagree.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: notes-wasm-pkg
          path: src/lib/notes/pkg/
          retention-days: 7

  shell:
    name: Rust shell compiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Stage bundle inputs (tauri-build verifies sidecar and resource paths)
        run: |
          bash scripts/stage-backend.sh
          bash scripts/fetch-uv.sh
          # The web app is bundled too (build-all.sh copies build/); an empty one does here.
          mkdir -p src-tauri/resources/web
          # The link sidecar only has to exist here; its own job builds and tests it.
          touch "src-tauri/binaries/mnemosyne-link-$(rustc -vV | sed -n 's/^host: //p')"
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  link:
    name: Remote-access link (iroh tunnel)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: link
      - run: cargo fmt --check --manifest-path link/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path link/Cargo.toml -- -D warnings
      # Home and a device on one machine with relays off: pairing, tunnelling, removal.
      - run: cargo test --manifest-path link/Cargo.toml

  publish-host:
    name: Publish host (encrypted publications)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: publish-host
      - run: cargo fmt --check --manifest-path publish-host/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path publish-host/Cargo.toml -- -D warnings
      # In process against a fixture viewer folder: no built viewer, network or ports needed.
      - run: cargo test --locked --manifest-path publish-host/Cargo.toml
