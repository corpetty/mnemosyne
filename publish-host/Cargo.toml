[package]
name = "mnemosyne-publish-host"
version = "0.1.0"
description = "Stores encrypted Mnemosyne publications (ciphertext only) and serves the static viewer"
authors = ["corpetty"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "mnemosyne_publish_host"

[[bin]]
name = "mnemosyne-publish-host"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "ws"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
