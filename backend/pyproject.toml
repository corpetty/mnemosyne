[project]
name = "mnemosyne-backend"
version = "0.1.0"
description = "Mnemosyne backend: audio transcription, diarization, and summarization"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "numpy>=2.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# ML inference stack. Install with: uv sync --extra gpu
# torch/torchaudio are pinned to the CUDA 12.8 wheel index (see [[tool.uv.index]]).
gpu = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "whisperx>=3.8.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pyinstaller>=6.19",
]

[tool.uv]
managed = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom.
extend-immutable-calls = ["fastapi.Depends"]
