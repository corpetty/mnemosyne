# docker compose up -d   (on a server with ports 80/tcp, 443/tcp and 7842/udp open)
services:
  iroh-relay:
    image: n0computer/iroh-relay:v1.3.0
    command: ["--config-path", "/etc/iroh-relay.toml"]
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "7842:7842/udp"   # QUIC address discovery: helps devices find a direct path
    volumes:
      - ./iroh-relay.toml:/etc/iroh-relay.toml:ro
      - certs:/var/lib/iroh-relay/certs
volumes:
  certs:
