[package]
name = "mnemosyne-link"
version = "0.9.4"
description = "Remote access to a Mnemosyne backend: an end-to-end encrypted tunnel over iroh"
authors = ["corpetty"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lib]
name = "mnemosyne_link"

[[bin]]
name = "mnemosyne-link"
path = "src/main.rs"

[features]
# A plain-HTTP iroh relay for the browser e2e (`mnemosyne-link dev-relay`). Never on by default
# and never in release builds.
dev-relay = ["dep:iroh-relay"]

[dependencies]
# Only for the dev-relay feature (the same version the tests use).
iroh-relay = { version = "1.3", optional = true, default-features = false, features = ["server"] }
anyhow = "1"
# Only what publish-host already pulls in: `axum::serve` for the loopback host.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
getrandom = "0.2"
hashseq = { git = "https://github.com/davidrusu/hashseq", rev = "94f5e3c" }
# The notes document (render, parse, set_text) and the text diff, shared with notes-wasm.
notes-core = { path = "../notes-core" }
# The publish host runs inside the sidecar to serve guest-notes rooms on loopback.
mnemosyne-publish-host = { path = "../publish-host" }
# The client side of the websocket the guest proxy opens to that host.
tokio-tungstenite = "0.29"
# Sink/Stream for that websocket (already in the tree through tokio-tungstenite).
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
clap = { version = "4", features = ["derive"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.6"
iroh-tickets = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# A local relay server for tests, and trusting its self-signed certificate.
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "test-utils"] }
iroh-relay = { version = "1.3", default-features = false, features = ["test-utils"] }

# Shipped next to the app as a sidecar: keep it small.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
