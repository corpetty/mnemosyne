[package]
name = "mnemosyne-link"
version = "0.9.4"
description = "Remote access to a Mnemosyne backend: an end-to-end encrypted tunnel over iroh"
authors = ["corpetty"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lib]
name = "mnemosyne_link"

[[bin]]
name = "mnemosyne-link"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# A local relay server for tests, and trusting its self-signed certificate.
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "test-utils"] }
iroh-relay = { version = "1.3", default-features = false, features = ["test-utils"] }

# Shipped next to the app as a sidecar: keep it small.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
