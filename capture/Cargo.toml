[package]
name = "mnemosyne-capture"
version = "0.1.0"
description = "Audio capture sidecar for Mnemosyne: records a source to a growing WAV file, as pw-record does"
authors = ["corpetty"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lib]
name = "mnemosyne_capture"

[[bin]]
name = "mnemosyne-capture"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
hound = "3"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Shipped next to the app as a sidecar: keep it small. Not "abort" on panic: a panic in a
# real-time audio callback must not leave the WAV unfinished without a log line.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
